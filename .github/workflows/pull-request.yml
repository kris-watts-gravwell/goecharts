name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC, so a newly published vulnerability shows up on
    # main rather than on somebody's unrelated pull request.
    - cron: "0 6 * * 1"

env:
  CGO_ENABLED: "0"

permissions:
  contents: read

jobs:
  checks:
    # Keep this name stable: it is the status check branch protection sees.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the version go.mod names: its toolchain line when there
      # is one, otherwise its go line.
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # The checks below are independent and none of them modifies the
      # checkout, so each one runs even if an earlier one failed.
      - name: Check that go mod tidy changes nothing
        if: ${{ !cancelled() }}
        run: go mod tidy -diff

      - name: Check that go fmt changes nothing
        if: ${{ !cancelled() }}
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt would change these files:"
            echo "$files"
            gofmt -d .
            exit 1
          fi

      - name: Check that go fix changes nothing
        if: ${{ !cancelled() }}
        run: go fix -diff ./...

      - name: Run go vet
        if: ${{ !cancelled() }}
        run: go vet ./...

      - name: Check for vulnerable packages
        if: ${{ !cancelled() }}
        run: govulncheck ./...

      - name: Run the unit tests
        if: ${{ !cancelled() }}
        run: go test ./...
